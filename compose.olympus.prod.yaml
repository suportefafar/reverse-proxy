services:
  reverse-proxy:
    environment:
      CADDY_ENVIRONMENT: production
      DOMAIN_SUFFIX: ufmg.br
    depends_on:
      - institutional-website
      - intranet-website
      - escuta-website-wp
    volumes:
      - ${REVERSE_PROXY_DIR:?olymctl must set REVERSE_PROXY_DIR}/web-server/Caddyfile.olympus.prod:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ${TLS_CERTS_PATH:?Set TLS_CERTS_PATH in reverse-proxy/.env}
        target: /etc/ssl/certs/farmacia
        read_only: true

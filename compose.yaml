version: "3"

volumes:
  web-server-logs:

services:
  web-server:
    build:
      context: ./web-server
      dockerfile: Dockerfile
    image: web-server
    container_name: container_web_server
    restart: always
    network_mode: "host"

  portainer_agent:
    image: portainer/agent:2.27.7
    container_name: portainer_agent
    restart: always
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
    security_opt:
      - no-new-privileges:true

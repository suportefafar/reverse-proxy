services:
  reverse-proxy:
    build:
      context: ${REVERSE_PROXY_DIR:?olymctl must set REVERSE_PROXY_DIR}/web-server
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    restart: unless-stopped
    networks:
      - edge

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
